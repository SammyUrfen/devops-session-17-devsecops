apiVersion: apps/v1
kind: Deployment
metadata:
  name: session17-python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session17-python
  template:
    metadata:
      labels:
        app: session17-python
    spec:
      imagePullSecrets:
        - name: ghcr-pull          # GHCR packages are private by default; the workflow creates this Secret
      securityContext:
        runAsNonRoot: true
      containers:
        - name: session17-python
          image: __IMAGE__         # replaced by the workflow with ghcr.io/sammyurfen/...:<sha>
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
